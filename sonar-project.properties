# SonarQube / SonarLint configuration.
#
# Sonar's default PHP profile follows PSR-12. WordPress does not, and this is a
# WordPress theme and plugin family: the authoritative linter for this
# repository is PHP_CodeSniffer with the WordPress standard, configured in
# phpcs.xml and runnable with `npm run lint:php`.
#
# The two rules disabled below are not style preferences. Following either one
# would make the code fail a WordPress.org or Envato review.

sonar.projectKey=basalt
sonar.projectName=Basalt
sonar.sources=basalt,plugins,examples,tools
sonar.exclusions=dist/**,node_modules/**,**/languages/**
sonar.php.file.suffixes=php
sonar.sourceEncoding=UTF-8

sonar.issue.ignore.multicriteria=wpcsTabs,wpcsFunctionNames,wpcsMethodNames

# php:S105 "Tabs should not be used for indentation".
#
# WordPress Coding Standards require tabs, not spaces:
# "Use real tabs and not spaces, as this allows the most flexibility across
# clients." It is the first rule in the PHP coding standards handbook, and
# PHPCS with the WordPress standard fails a file that uses spaces. The two
# tools cannot both be satisfied, and for this codebase WordPress wins.
sonar.issue.ignore.multicriteria.wpcsTabs.ruleKey=php:S105
sonar.issue.ignore.multicriteria.wpcsTabs.resourceKey=**/*.php

# php:S1542 "Function names should comply with a naming convention".
#
# The default expression is ^[a-z][a-zA-Z0-9]*$, which is camelCase. WordPress
# requires snake_case, and more importantly requires every global function to
# carry a unique prefix, because themes and plugins share one global namespace
# with core and with every other plugin on the site. That is why the functions
# here are named basalt_* and basalt_core_* rather than loadTextdomain, and
# renaming them as Sonar suggests would introduce exactly the collisions the
# prefix exists to prevent.
sonar.issue.ignore.multicriteria.wpcsFunctionNames.ruleKey=php:S1542
sonar.issue.ignore.multicriteria.wpcsFunctionNames.resourceKey=**/*.php

# php:S100, the same rule for methods. Walker_Nav_Menu subclasses and the like
# must match the parent signatures core defines.
sonar.issue.ignore.multicriteria.wpcsMethodNames.ruleKey=php:S100
sonar.issue.ignore.multicriteria.wpcsMethodNames.resourceKey=**/*.php
